services:
  web:
    image: registry:5000/harmocrew-web:latest
    ports:
      - target: 80
        published: 8000
        protocol: tcp
        mode: ingress
    networks:
      - backend
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
      update_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: on-failure

  api:
    image: registry:5000/harmocrew-api:latest
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/harmocrew
      SPRING_DATASOURCE_USERNAME: harmocrew
      SPRING_DATASOURCE_PASSWORD: harmocrew
      APP_JWT_SECRET: harmocrew-swarm-demonstration-secret
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 10s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harmocrew
      POSTGRES_USER: harmocrew
      POSTGRES_PASSWORD: harmocrew
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmocrew -d harmocrew"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
      placement:
        constraints:
          - node.role == manager

networks:
  backend:
    driver: overlay
    attachable: true

volumes:
  db-data:
