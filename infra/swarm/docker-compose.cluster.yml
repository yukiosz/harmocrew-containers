# Laboratorio do Swarm: 3 Docker Engines em containers (Docker-in-Docker)
# + um registry local de onde os nos baixam as imagens do projeto.
services:
  registry:
    image: registry:2
    container_name: harmocrew-registry
    networks:
      - swarm-lab
    restart: unless-stopped

  manager:
    image: docker:29-dind
    container_name: harmocrew-manager
    hostname: manager
    privileged: true
    command:
      - --tls=false
      - --insecure-registry=registry:5000
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:2375:2375"   # API do Docker do manager (DOCKER_HOST)
      # As portas publicadas pela stack existem DENTRO do manager.
      # Este mapeamento leva-as ate o navegador do host.
      - "127.0.0.1:8000:8000"   # web
      - "127.0.0.1:8080:8080"   # api (routing mesh)
      - "127.0.0.1:8081:8081"   # Docker Visualizer
    volumes:
      - manager-data:/var/lib/docker
    networks:
      - swarm-lab
    restart: unless-stopped

  worker-1:
    image: docker:29-dind
    container_name: harmocrew-worker-1
    hostname: worker-1
    privileged: true
    command:
      - --tls=false
      - --insecure-registry=registry:5000
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - worker-1-data:/var/lib/docker
    networks:
      - swarm-lab
    restart: unless-stopped

  worker-2:
    image: docker:29-dind
    container_name: harmocrew-worker-2
    hostname: worker-2
    privileged: true
    command:
      - --tls=false
      - --insecure-registry=registry:5000
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - worker-2-data:/var/lib/docker
    networks:
      - swarm-lab
    restart: unless-stopped

networks:
  swarm-lab:
    name: harmocrew-swarm-lab

volumes:
  manager-data:
  worker-1-data:
  worker-2-data:
