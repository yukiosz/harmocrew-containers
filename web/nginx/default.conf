server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker (Compose e Swarm). No Swarm, "api" resolve para o
    # IP virtual do servico, que distribui as requisicoes entre as replicas.
    # Com variavel, o nome e resolvido a cada requisicao (e nao so no boot).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # /api/... -> api:8080/api/... (a API Spring ja usa o prefixo /api)
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger e health da API tambem passam pelo NGINX (porta unica no host)
    location ~ ^/(swagger-ui|swagger-ui\.html|v3/api-docs|health) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: qualquer rota do app devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
