# Ambiente local (sem Swarm). Um container por responsabilidade:
#   web  -> React compilado, servido por NGINX (porta 8000 do host)
#   api  -> Spring Boot (sem porta no host; acessada pelo NGINX do web)
#   db   -> PostgreSQL com volume persistente
#
#   docker compose up -d --build
#   docker compose up -d --scale api=4     # variacao de replicas
#   docker stats                           # consumo x limites
services:
  web:
    build: ./web
    image: harmocrew-web:local
    ports:
      - "8000:80"
    networks:
      - harmocrew
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  api:
    build: ./api
    image: harmocrew-api:local
    # Sem container_name e sem porta no host: assim o servico pode ter
    # varias replicas. O DNS do Docker entrega os IPs de todas ao NGINX.
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/harmocrew
      SPRING_DATASOURCE_USERNAME: harmocrew
      SPRING_DATASOURCE_PASSWORD: harmocrew
      APP_JWT_SECRET: harmocrew-development-secret-change-me
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    networks:
      - harmocrew
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harmocrew
      POSTGRES_USER: harmocrew
      POSTGRES_PASSWORD: harmocrew
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - harmocrew
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmocrew -d harmocrew"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  harmocrew:
    name: harmocrew-net

volumes:
  db-data:
    name: harmocrew-db-data
